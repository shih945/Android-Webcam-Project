[package]
name = "awc"
version = "1.0.6"
edition = "2021"
description = "AWC desktop client — egui + Rust video pipeline"
license = "GPL-3.0"
build = "build.rs"

[[bin]]
name = "awc"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.34.3", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.34.3"
shadcn-egui = "0.7.0"
ffmpeg-next = "8.1.0"
ffmpeg-sys-next = "8.1.0"
zune-jpeg = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
